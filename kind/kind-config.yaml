kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "camunda.local/workloads=true"
    extraMounts:
      - hostPath: /etc/ssl/certs
        containerPath: /etc/ssl/certs

