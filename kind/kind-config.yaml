kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      # The lifecycle scripts replace this with ~/.certs/Zscaler Root CA.pem.
      - hostPath: '__LOCAL_CA_CERT__'
        containerPath: /usr/local/share/ca-certificates/camunda-local-ca.crt
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "camunda.local/workloads=true"

