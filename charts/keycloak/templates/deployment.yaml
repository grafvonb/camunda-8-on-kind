apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "local-keycloak.fullname" . }}
  labels:
    {{- include "local-keycloak.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "local-keycloak.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "local-keycloak.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - sh
            - -ec
            - until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do sleep 2; done
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - start-dev
            - "--http-relative-path={{ .Values.httpRelativePath }}"
            - --health-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.auth.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-keycloak.fullname" . }}
                  key: admin-password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: KC_DB_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-keycloak.fullname" . }}
                  key: database-password
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: {{ printf "%shealth/started" .Values.httpRelativePath | quote }}
              port: management
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ printf "%shealth/ready" .Values.httpRelativePath | quote }}
              port: management
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: {{ printf "%shealth/live" .Values.httpRelativePath | quote }}
              port: management
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
