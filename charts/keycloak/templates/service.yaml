apiVersion: v1
kind: Service
metadata:
  name: {{ include "local-keycloak.fullname" . }}
  labels:
    {{- include "local-keycloak.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "local-keycloak.labels" . | nindent 4 }}

