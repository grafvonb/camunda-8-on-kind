apiVersion: v1
kind: Service
metadata:
  name: {{ include "local-postgresql.fullname" . }}
  labels:
    {{- include "local-postgresql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
  selector:
    {{- include "local-postgresql.labels" . | nindent 4 }}

