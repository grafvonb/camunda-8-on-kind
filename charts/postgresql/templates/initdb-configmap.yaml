apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "local-postgresql.fullname" . }}-initdb
  labels:
    {{- include "local-postgresql.labels" . | nindent 4 }}
data:
  01-create-databases.sh: |
    #!/bin/sh
    set -eu
    {{- range .Values.databases }}
    if ! psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align \
      --command "SELECT 1 FROM pg_database WHERE datname = '{{ . }}'" | grep -q 1; then
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
        --command 'CREATE DATABASE "{{ . }}"'
    fi
    {{- end }}
