clusterName: elasticsearch
replicas: 1
minimumMasterNodes: 1
protocol: http
# Elastic's official Docker Hub image avoids the Elastic registry's blob
# endpoint, which returns HTTP 403 on this local network.
image: docker.io/library/elasticsearch
# Camunda 8.10 GA requires Elasticsearch 8.19+ (or a supported 9.x release).
imageTag: "8.19.23"
createCert: false
secret:
  enabled: true
esConfig:
  elasticsearch.yml: |
    cluster.name: elasticsearch
    network.host: 0.0.0.0
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
extraEnvs:
  - name: ES_JAVA_OPTS
    value: "-Xms512m -Xmx512m"
# Camunda manages its own index templates and replica count (see core.yaml).
# A broad composable template here would override Camunda's field mappings.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
volumeClaimTemplate:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi

