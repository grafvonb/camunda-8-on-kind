global:
  multitenancy:
    enabled: true
  security:
    authentication:
      method: oidc
  identity:
    keycloak:
      url:
        protocol: http
        host: keycloak
        port: "80"
      auth:
        adminUser: admin
        secret:
          inlineSecret: keycloak-local-admin
    auth:
      enabled: true
      publicIssuerUrl: "http://localhost:18080/auth/realms/camunda-platform"
      admin:
        enabled: true
        secret:
          inlineSecret: camunda-admin-local-secret

identity:
  enabled: true
  firstUser:
    enabled: true
    username: demo
    email: demo@example.org
    firstName: Demo
    lastName: User
    secret:
      inlineSecret: demo
  clients:
    - id: c8volt
      name: c8volt local development
      secret:
        inlineSecret: c8volt-local-secret
      redirectUris: "/*"
      rootUrl: "http://localhost"
      type: confidential
      permissions:
        - resourceServerId: orchestration-api
          definition: read:*
        - resourceServerId: orchestration-api
          definition: write:*
  initContainers:
    - name: wait-for-local-dependencies
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      command:
        - sh
        - -ec
        - |
          until nc -z postgresql 5432; do sleep 2; done
          until wget -q --spider http://keycloak/auth/; do sleep 2; done
  externalDatabase:
    enabled: true
    host: postgresql
    port: 5432
    database: identity
    username: camunda
    secret:
      inlineSecret: camunda-postgresql-local
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

orchestration:
  enabled: true
  profiles:
    broker: true
    admin: true
    operate: true
    tasklist: true
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  cpuThreadCount: "2"
  ioThreadCount: "2"
  pvcSize: 8Gi
  data:
    secondaryStorage:
      type: elasticsearch
      elasticsearch:
        url: "http://elasticsearch-master:9200"
  multitenancy:
    checks:
      enabled: true
    api:
      enabled: true
  security:
    authentication:
      method: oidc
      oidc:
        redirectUrl: "http://localhost:8080"
        secret:
          inlineSecret: orchestration-local-secret
        backwardsCompatibleAudiences:
          - operate-api
          - tasklist-api
          - zeebe-api
    initialization:
      defaultRoles:
        admin:
          users:
            - demo
          clients:
            - c8volt
      mappingRules:
        - mappingRuleId: c8volt-client
          claimName: client_id
          claimValue: c8volt
  resources:
    requests:
      cpu: 750m
      memory: 1600Mi
    limits:
      cpu: "2"
      memory: 2500Mi

optimize:
  enabled: false
connectors:
  enabled: false
camundaHub:
  enabled: false
